<!DOCTYPE html>
<html lang="pt-BR">   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Login</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/6681/6681204.png">
</head>
<form action="/enviar" method="post">
    <center>
        <h1>Entar na Conta</h1>
        <br>
        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email" placeholder="Informe seu e-mail">
        <br>
        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" placeholder="Informe sua senha">
        <br><br>
        <button type="submit">Entrar</button>
        
    </center>
</form>
