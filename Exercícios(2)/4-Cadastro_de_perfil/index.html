<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Perfil</title>
</head>
<body>
    <center>
        <h1>Criar Perfil</h1>
        <div>
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" placeholder="digite seu nome:">
        </div>
        <div>
            <label for="usuario">Nome de Usuário:</label>
            <input type="text" name="usuario" id="usuario" placeholder="digite seu usuário:">
        </div>
        <div>
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" placeholder="digite sua senha">
        </div>
        <div>
            <label for="confirmar">Confirmar Senha:</label>
            <input type="password" name="confirmar" id="confirmar" placeholder="confirme sua senha:">
        </div>
        <div>
            <textarea name="mensagem" rows="5" placeholder="Escreva sua biografia"></textarea>
        </div>
        <div>
            <button type="submit">Criar Perfil</button>
        </div>
    </center>
</body>
</html>
