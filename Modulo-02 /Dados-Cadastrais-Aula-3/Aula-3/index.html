<!DOCTYPE html>
<html>
    <form acition="#" method="post">
        <h1>Dados Cadastrais</h1>
        <label for="nome">Nome:</label>
        <input type="text" name='nome' placeholder="Digite o seu nome:">
        <br>
        <label for="email">E-mail:</label>
        <input type="email" name='email' placeholder="seu.@email.com">
        <br>
        <label for="password">Password:</label>
        <input type="password" id="senha" name='senha' placeholder="Digite sua senha">
        <br>
        <label for="idade">Idade:</label>
        <input type="number" name='idade' placeholder="Digite sua idade">
        <br>
        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" name='nascimento' placeholder="">
        <br>
        <input type="checkbox" name="genero" value="sim"> Aceito os termos
        <br>
        <input type="radio" name="genero" value="m"> Masculino
        <br>
        <input type="radio" name="genero" value="m"> Feminino
        <br>
        <input type="radio" name="genero" value="m"> Outro
        <br>
        <input type="file" name="Foto_perfil">
        <br>
        <br>
        <select name="assunto">
            <option value="Duvida">Duvida</option>
            <option value="Elogio">Elogio</option>
            <option value="reclamacao">Reclamação</option>
        </select>
        <br>
        <textarea name='mensagem' rows="5" placeholder='Escreva sua mensagem'></textarea>
    </form>
</html>
