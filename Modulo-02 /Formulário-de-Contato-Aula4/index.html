<!DOCTYPE html>
<html>
    <form id="#form-contato" acition="/enviar" method="post">
       
            <center>
                <h1>Formulário de Contato</h1>
                <label for="nome"> Username:</label>
                <input type="text" required name='nome' placeholder="Digite o seu nome:"><br><br>
                <label for="email">E-mail:</label>
                <input type="email" required id="email" name='email' placeholder="seu.@email.com"><br><br>
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" title="Formato esperado: 00-00000-0000" required><br><br>
                <label for="mensagem">Mensagem: </label>
                <textarea name='mensagem' required rows="5" placeholder='Escreva sua mensagem'></textarea>
            
            </center>

        </form>
</html>














            <script>
                const formulario = document.querySelector("#form-contato");

                formulario.addEventListener("submit", function (event) {
                event.preventDefault();
                alert("Menssagem enviada com sucesso!");
                });
            </script>
